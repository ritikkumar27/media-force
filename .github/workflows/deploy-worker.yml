name: Deploy Worker to Homelab

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'Dockerfile.worker'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-worker.yml'
      
  # Automatically rebuild every Sunday at 3 AM to get the newest yt-dlp!
  schedule:
    - cron: '0 3 * * 0' 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ritikkumar27/media-force

jobs:
  build-and-push-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{env.REGISTRY}}/${{env.IMAGE_NAME}}-worker:latest
            ${{env.REGISTRY}}/${{env.IMAGE_NAME}}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build-and-push-worker
    runs-on: homelab mediaforce
    steps:
      - name: Pull and Deploy on Homelab
        run: |
          echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd /srv/docker/apps/mediaforce
          docker compose pull
          docker compose up -d