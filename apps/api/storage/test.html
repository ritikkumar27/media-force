<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Secure Test</title>
    <!-- Import the Socket.io client library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: #fff; }
        #status { padding: 10px; margin-bottom: 20px; border-radius: 5px; background: #333; }
        .connected { border-left: 5px solid #4CAF50; }
        .disconnected { border-left: 5px solid #F44336; }
        #progress-container { width: 100%; max-width: 500px; background: #444; border-radius: 10px; overflow: hidden; }
        #progress-bar { width: 0%; height: 30px; background: #4CAF50; transition: width 0.3s; }
        #log { margin-top: 20px; font-family: monospace; color: #aaa; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Live Download Progress</h2>
    
    <div id="status" class="disconnected">Status: Disconnected</div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    
    <div id="log">Waiting for events...</div>

    <script>
        // 1. Setup your credentials
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjZDBhMTJmZS0zOWY3LTQ3YzMtYTEzYy03ZGQxYjM3MGU3MjAiLCJlbWFpbCI6InJrdjAxQGRlbW8uY29tIiwiaWF0IjoxNzgzOTA5MTExLCJleHAiOjE3ODM5OTU1MTF9.Q97cJkTgwG2Kn10DyA79EWdes2SfnoOu-Jx9exfnySI";
        const JOB_ID = "98f699f8-5893-4ed8-8cc9-03be9d806361";

        // 2. Connect to the WebSocket and pass the token in the 'auth' object
        const socket = io('http://localhost:3000', {
            auth: {
                token: TOKEN
            }
        });

        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progress-bar');
        const logEl = document.getElementById('log');

        function logMessage(msg) {
            logEl.textContent = msg + '\n' + logEl.textContent;
        }

        // --- Connection Events ---
        socket.on('connect', () => {
            statusEl.textContent = 'Status: Connected securely!';
            statusEl.className = 'connected';
            logMessage('✅ Passed the Guard. Socket ID: ' + socket.id);

            const jobId = "";
            socket.emit('subscribeToJob', jobId);
        });

        socket.on(`download-progress-${jobid}`, (progress) => {

            console.log(`Progress: ${progress}%`);

        })

        socket.on('connect_error', (err) => {
            statusEl.textContent = 'Status: Connection Failed (Unauthorized)';
            statusEl.className = 'disconnected';
            logMessage('❌ Connection Error: ' + err.message);
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Status: Disconnected';
            statusEl.className = 'disconnected';
            logMessage('⚠️ Disconnected from server');
        });

        // --- Download Progress Event ---
        // Listen specifically to the channel for this Job ID
        const eventName = `download-progress-${JOB_ID}`;
        
        socket.on(eventName, (progress) => {
            // Remove any % signs if your backend sends them, and parse the number
            const percentage = parseFloat(progress);
            
            // Update the visual progress bar
            progressBar.style.width = percentage + '%';
            
            logMessage(`📥 Progress updated: ${percentage}%`);
        });

    </script>
</body>
</html>
